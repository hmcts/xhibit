#
# XHIBIT Search - Generic accross Cards/Steps
#

# the 'name' property is used as the title of the Search component screen.
# you may override it by providing xxxxxxxxx.name = yyyyyyyyyyy and calling setName()
xs.gen.name = XHIBIT Search

# button labels (buttons not part of the applyokcancel collab)
xs.gen.search=Search
xs.gen.back=Back
xs.gen.details=Details
xs.gen.ok=Ok
xs.gen.cancel=Cancel
xs.gen.or=OR

# the 'width' property is used as to size the Search component screen.
# you may override it by providing xxxxxxxxx.height = anIntValue and implementing a public int getScreenWidth() method
# that fecthes your overriding xxxxxxxxx.width property.
xs.gen.width = 400

# the 'height' property is used as to size the Search component screen.
# you may override it by providing xxxxxxxxx.height = anIntValue and implementing a public int getScreenHeight() method
# that fecthes your overriding xxxxxxxxx.height property.
xs.gen.height = 400
xs.gen.nomatchestitle = No Results!
xs.gen.nomatchestext = No data was found matching your criteria. Please modify the criteria.


#
# XHIBIT Search Criteria Card - 1st step in the Search Component/Sequence
#
xs.gen.CriteriaCard.title = -Generic- CriteriaCard.title
xs.gen.CriteriaCard.description = -Generic- CriteriaCard.description
xs.gen.CriteriaCard.label=xxLABELxx

#
# XHIBIT Search Result List Card - 2nd step in the Seach Component/Sequence
#
xs.gen.ResultListCard.title = -Generic- ResultListCard.title
xs.gen.ResultListCard.description = -Generic- v.description
xs.gen.ResultListCard.label = colLABELcol
xs.gen.ResultListCard.sortTableColumn = OFF
#xs.gen.ResultListCard.sortTableColumnSort = ASC



#
# XHIBIT Search Result Item Detail - 3rd step in the Search Component/Sequence
#
xs.gen.ResultDetailsCard.title = -Generic- ResultDetailsCard.title
xs.gen.ResultDetailsCard.description = -Generic- ResultDetailsCard.description
xs.gen.ResultDetailsCard.label=yyLABELyy

#
# XHIBIT Search Update
#
