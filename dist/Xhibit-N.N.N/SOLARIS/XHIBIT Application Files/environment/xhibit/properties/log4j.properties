#
# Root Loggers
#

# XhibitLayout logs the following pattern %d{HH:mm:ss,SSS} %-5p %c{1} - %m%n

# Set root category priority to DEBUG and its only appender to General.
log4j.rootCategory=DEBUG, DailyRollingFile, ErrorRollingFile, Console

# The following entries set the logging threshold for specific loggers
log4j.logger.uk.gov.courtservice.xhibit.business.services.messaging.MessagingControllerBean=WARN
log4j.logger.uk.gov.courtservice.xhibit.business.services.terminallocation.XHBTerminalLocations=WARN
log4j.logger.uk.gov.courtservice.framework.services.directory.JNDIDirectoryServices=WARN
log4j.logger.uk.gov.courtservice.framework.services.database.SQLRunner=WARN
log4j.logger.uk.gov.courtservice.framework.services.XSLServices=WARN
log4j.logger.uk.gov.courtservice.framework.services.DBServices=WARN
log4j.logger.uk.gov.courtservice.xhibit.client.im.util.InstantMessageServices=WARN
log4j.logger.uk.gov.courtservice.xhibit.business.services.terminallocation.TerminalLocation=WARN
log4j.logger.uk.gov.courtservice.xhibit.business.services.terminallocation.ADTerminalLocations=WARN
log4j.logger.uk.gov.courtservice.xhibit.web.publicdisplay.messaging.work.ThreadPool=WARN
log4j.logger.uk.gov.courtservice.framework.client.delegate.XhibitHandler=INFO
log4j.logger.uk.gov.courtservice.framework.jdbc.core.JdbcHelper=INFO

# Console application
log4j.logger.org.apache.commons=INFO
log4j.logger.org.apache.struts=INFO
log4j.logger.org.apache.struts.util=WARN
log4j.logger.org.apache.beehive=INFO
log4j.logger.com.bea.console=INFO
log4j.logger.org.apache.beehive.netui.core.urltemplates.URLTemplateDescriptor=FATAL

# General is set to be a ConsoleAppender (ie stdout)
log4j.appender.Console=org.apache.log4j.ConsoleAppender
log4j.appender.Console.layout=uk.gov.courtservice.framework.log4j.XhibitLayout
log4j.appender.Console.threshold=DEBUG

# DailyRollingFile.
log4j.appender.DailyRollingFile=org.apache.log4j.DailyRollingFileAppender
log4j.appender.DailyRollingFile.DatePattern=yyyy-MM-dd
log4j.appender.DailyRollingFile.File=${log4j.log.dir}/${weblogic.Name}.xhibit.log
log4j.appender.DailyRollingFile.layout=uk.gov.courtservice.framework.log4j.XhibitLayout
log4j.appender.DailyRollingFile.threshold=DEBUG

# ErrorRollingFile.
log4j.appender.ErrorRollingFile=org.apache.log4j.RollingFileAppender
log4j.appender.ErrorRollingFile.File=${log4j.log.dir}/${weblogic.Name}.error.log
log4j.appender.ErrorRollingFile.layout=uk.gov.courtservice.framework.log4j.XhibitLayout
log4j.appender.ErrorRollingFile.threshold=ERROR

#
# Security loggers
#

# Set the log for the role mapping provider to only log to the security log
log4j.logger.uk.gov.courtservice.framework.security=DEBUG, SecurityRollingFile
log4j.additivity.uk.gov.courtservice.framework.security=false

log4j.logger.uk.gov.courtservice.framework.security.providers.authorization=WARN, SecurityRollingFile
log4j.additivity.uk.gov.courtservice.framework.security.providers.authorization=false

# SecurityRollingFile.
# XhibitLayout logs the following pattern %d{HH:mm:ss,SSS} %-5p %c{1} - %m%n
log4j.appender.SecurityRollingFile=org.apache.log4j.DailyRollingFileAppender
log4j.appender.SecurityRollingFile.DatePattern=yyyy-MM-dd
log4j.appender.SecurityRollingFile.File=${log4j.log.dir}/${weblogic.Name}.security.log
log4j.appender.SecurityRollingFile.layout=uk.gov.courtservice.framework.log4j.XhibitLayout
log4j.appender.SecurityRollingFile.threshold=DEBUG


